[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "nexus-remote"
version = "0.3.0"
description = "Nexus Remote - universal remote access and device management workspace"
readme = "README.md"
requires-python = ">=3.11"
license = "LicenseRef-Proprietary"
dependencies = [
    "PySide6>=6.7",
    "paramiko>=3.4",
    "keyring>=25.0",
    "PyYAML>=6.0",
    "pyte>=0.8.1",
    "pyserial>=3.5",
    "pywinpty>=3.0; sys_platform == 'win32'",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]
build = [
    "pyinstaller>=6.0",
]
smb = [
    "smbprotocol>=1.13",
]

[project.scripts]
nexus-remote = "nexus_remote.main:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
nexus_remote = [
    "storage/migrations/*.sql",
    "resources/*.ico",
    "resources/*.png",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
# A deliberate, stable set: real errors (E/F), import order, modern syntax,
# bug-prone patterns (B), simplifications and measured hot-path checks (PERF).
select = ["E4", "E7", "E9", "F", "W", "I", "UP", "B", "C4", "SIM", "PIE", "PERF", "RUF", "N802"]
ignore = [
    # Deliberately broad excepts: protocol backends, the OS vault and PTY
    # teardown must never turn a best-effort cleanup into a crash.
    "BLE001",
    "S110",
    # Ambiguous unicode in prose strings is intentional (ellipsis, arrows).
    "RUF001",
    "RUF002",
    "RUF003",
    # ``str, Enum`` mixins are kept: switching to StrEnum changes how members
    # are stringified (audit records and the UI rely on the current form).
    "UP042",
]

[tool.ruff.lint.per-file-ignores]
# Tests drive private state and use broad assertions on purpose.
"tests/*" = ["B017", "B011", "SLF001", "TRY002", "RUF059"]
